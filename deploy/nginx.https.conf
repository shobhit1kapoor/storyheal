map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream storyheal_api { server storyheal-api:8000; }
upstream storyheal_web { server storyheal-web:80; }
upstream storyheal_widget { server storyheal-widget:80; }
upstream storyheal_im { server wukongim:5200; }

server {
  listen 80;
  server_name _;
  location = /health { access_log off; return 200 "ok\n"; }
  location / { return 308 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  client_max_body_size 25m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /health { access_log off; return 200 "ok\n"; }
  location /api/ { proxy_pass http://storyheal_api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /widget/ { proxy_pass http://storyheal_widget/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  location /wss { proxy_pass http://storyheal_im/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 3600s; }
  location / { proxy_pass http://storyheal_web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
