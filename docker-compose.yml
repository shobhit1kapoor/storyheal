name: storyheal

x-common: &common
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-storyheal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storyheal}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/4
  CELERY_RESULT_BACKEND: redis://redis:6379/4
  RAG_SERVICE_URL: http://storyheal-rag:8082
  RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?set RAG_INTERNAL_API_KEY}
  AI_SERVICE_URL: http://storyheal-ai:8081
  AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-300}
  AI_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set INTERNAL_SERVICE_API_KEY}
  PLATFORM_SERVICE_URL: http://storyheal-platform:8003
  WUKONGIM_SERVICE_URL: http://wukongim:5001
  WUKONGIM_ENABLED: "true"
  INTERNAL_SERVICE_HOST: 0.0.0.0

services:
  postgres:
    <<: *common
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storyheal}
      POSTGRES_USER: ${POSTGRES_USER:-storyheal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storyheal} -d ${POSTGRES_DB:-storyheal}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wukongim:
    <<: *common
    image: ghcr.io/wukongim/wukongim:v2.2.5-20260422
    environment:
      WK_CLUSTER_NODEID: 1001
      WK_CLUSTER_SERVERADDR: wukongim:11110
      WK_CLUSTER_APIURL: http://wukongim:5001
      WK_INTRANET_TCPADDR: wukongim:5100
      WK_MODE: release
      WK_EXTERNAL_IP: ${PUBLIC_HOST:-127.0.0.1}
      WK_EXTERNAL_WSADDR: ${WK_EXTERNAL_WSADDR:-}
      WK_EXTERNAL_WSSADDR: ${WK_EXTERNAL_WSSADDR:-}
      WK_TOKENAUTHON: "true"
      WK_WEBHOOK_HTTPADDR: http://storyheal-api:8000/v1/integrations/wukongim/webhook
    volumes:
      - wukongim-data:/root/wukongim
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/health"]
      interval: 15s
      timeout: 8s
      retries: 10

  storyheal-rag:
    <<: *common
    build: ./repos/storyheal-rag
    environment:
      PORT: 8082
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-storyheal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storyheal}
      REDIS_URL: redis://redis:6379/2
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?set RAG_INTERNAL_API_KEY}
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${EMBEDDING_API_KEY:-ollama}
      OPENAI_COMPATIBLE_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.rag_service.main:app --host 0.0.0.0 --port 8082"]
    volumes:
      - rag-uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s

  storyheal-rag-worker:
    <<: *common
    build: ./repos/storyheal-rag
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-storyheal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storyheal}
      REDIS_URL: redis://redis:6379/2
      EMBEDDING_PROVIDER: openai_compatible
      EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      OPENAI_API_KEY: ${EMBEDDING_API_KEY:-ollama}
      OPENAI_COMPATIBLE_BASE_URL: ${EMBEDDING_BASE_URL:-http://ollama:11434/v1}
    command: ["celery", "-A", "src.rag_service.tasks.celery_app", "worker", "--loglevel=info", "-Q", "document_processing,embedding,website_crawling,qa_processing,celery"]
    volumes:
      - rag-uploads:/app/uploads
    depends_on:
      storyheal-rag: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A src.rag_service.tasks.celery_app inspect ping -d 'celery@$$HOSTNAME' --timeout=10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 30s

  storyheal-ai:
    <<: *common
    build: ./repos/storyheal-ai
    environment:
      PORT: 8081
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-storyheal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storyheal}
      REDIS_URL: redis://redis:6379/1
      API_SERVICE_URL: http://storyheal-api:8000
      API_INTERNAL_SERVICE_URL: http://storyheal-api:8001
      RAG_SERVICE_URL: http://storyheal-rag:8082
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      INTERNAL_SERVICE_API_KEY: ${INTERNAL_SERVICE_API_KEY:?set INTERNAL_SERVICE_API_KEY}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8081"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storyheal-rag: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 40s

  storyheal-api:
    <<: *common
    build: ./repos/storyheal-api
    environment: *api-environment
    command: ["sh", "-c", "alembic upgrade head && (uvicorn app.internal:internal_app --host 0.0.0.0 --port 8001 &) && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storyheal-rag: { condition: service_healthy }
      storyheal-ai: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready && curl -fsS http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 50s

  storyheal-knowledge-worker:
    <<: *common
    build: ./repos/storyheal-api
    environment: *api-environment
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "knowledge", "--hostname", "knowledge@%h"]
    volumes:
      - api-uploads:/app/uploads
    depends_on:
      storyheal-api: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A app.tasks.celery_app inspect ping -d 'knowledge@$$HOSTNAME' --timeout=10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 30s

  storyheal-knowledge-beat:
    <<: *common
    build: ./repos/storyheal-api
    environment: *api-environment
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    depends_on:
      storyheal-api: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && tr '\\0' ' ' </proc/1/cmdline | grep -q 'celery.*beat'"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 20s

  storyheal-platform:
    <<: *common
    build: ./repos/storyheal-platform
    environment:
      PORT: 8003
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-storyheal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storyheal}
      REDIS_URL: redis://redis:6379/0
      API_BASE_URL: http://storyheal-api:8000
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8003"]
    depends_on:
      storyheal-api: { condition: service_healthy }
      wukongim: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 6

  storyheal-web:
    <<: *common
    build: ./repos/storyheal-web
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 4

  storyheal-widget:
    <<: *common
    build: ./repos/storyheal-widget
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 4

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certs:/etc/nginx/certs:ro
    depends_on:
      storyheal-web: { condition: service_healthy }
      storyheal-widget: { condition: service_healthy }
      storyheal-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 4

  ollama:
    <<: *common
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10

  ollama-models:
    image: curlimages/curl:8.12.1
    profiles: ["local-ai"]
    restart: "no"
    command:
      - sh
      - -c
      - >-
        curl -fsS http://ollama:11434/api/pull -d '{"name":"${OLLAMA_MODEL:-qwen3:8b}"}' &&
        curl -fsS http://ollama:11434/api/pull -d '{"name":"${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:0.6b}"}'
    depends_on:
      ollama: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  wukongim-data:
  rag-uploads:
  api-uploads:
  ollama-data:
